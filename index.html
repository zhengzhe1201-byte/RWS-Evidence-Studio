<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="面向真实世界研究统计师的可审计数据治理、分析方案与证据报告交互演示" />
  <title>RWS Evidence Studio｜真实世界研究智能平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23087f79'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' font-family='Arial' font-weight='700' fill='white'%3ER%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div><strong>RWS Evidence</strong><span>真实世界研究协同工作台</span></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <span class="status-dot"></span> 合成数据演示环境
        <button id="reset-demo" class="text-button">重置演示</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">RWS PRODUCTIZATION DEMO</p>
          <h1 id="page-title">项目总览</h1>
        </div>
        <div class="top-actions">
          <div class="project-chip"><span>当前项目</span><strong>AECOPD · Tiotropium 30天再入院</strong></div>
          <button class="primary-button" data-go="question">开始研究</button>
        </div>
      </header>

      <div class="synthetic-banner">
        <strong>演示声明</strong> 本系统使用卜彦斌提供的AECOPD虚拟CSV，展示从研究方案、数据治理到统计分析和报告交付的完整流程；结果仅为探索性演示，不构成医学建议或正式研究证据。
      </div>

      <div id="view-root" class="view-root"></div>
    </main>
  </div>

  <div id="drawer-backdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden"></aside>
  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="aecopd-data.js"></script>
  <script src="data.js"></script>
  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
